# RelentNet instance (hq) on rai — interim, until Coolify owns the deploy (REL-290).
#
# Same stack as deploy/demo (Postgres + PostgREST + a one-route nginx + MinIO + the
# app), minus the Unraid reverse proxy. The app is published on rai's LAN address
# only. It runs WITHOUT a login (everyone is the seeded admin) until REL-291 lands,
# so never publish it beyond the LAN.
#
# Deploy + operate: see ./README.md. Setup is deploy/demo/setup.sh.
name: hq

services:
  db:
    image: supabase/postgres:17.6.1.167
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30

  rest:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [rest]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./data/minio:/data
    networks: [internal]

  web:
    container_name: hq-web
    # Built on a workstation and shipped (README). Never pulled from a registry.
    image: hq-web:latest
    pull_policy: never
    restart: unless-stopped
    depends_on: [gateway, minio]
    env_file: .env
    environment:
      SUPABASE_URL: http://gateway
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: demo
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      APP_BASE_URL: http://10.200.200.44:3000
      NEXT_PUBLIC_APP_URL: http://10.200.200.44:3000
      TZ: America/Chicago
    # LAN address only — not 0.0.0.0 (ufw would not filter a Docker-published port).
    ports: ['10.200.200.44:3000:3000']
    networks: [internal]

networks:
  internal: {}
