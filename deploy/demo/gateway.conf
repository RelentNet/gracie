# supabase-js requests `${SUPABASE_URL}/rest/v1/...`; PostgREST serves at its root.
# Variable upstream + Docker's resolver: if `rest` is down this returns 502 instead
# of nginx failing to start.
server {
  listen 80;
  resolver 127.0.0.11 valid=10s;

  location /rest/v1/ {
    set $upstream http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
  }
}
