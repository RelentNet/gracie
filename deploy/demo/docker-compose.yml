# White-label demo stack — the app plus the minimum it needs, for a single box.
#
# The app talks to its database through supabase-js, which only uses the REST API
# (PostgREST) — no Supabase auth, storage API, realtime or edge functions. So this
# runs Postgres + PostgREST behind a one-route nginx instead of the full Supabase
# platform, and MinIO for files (the S3 API production already uses).
#
# Deploy + operate: see deploy/demo/README.md.
name: demo

services:
  db:
    # Supabase's Postgres build: ships pgvector and the anon / authenticated /
    # service_role / authenticator roles PostgREST switches between.
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks: [internal]

  # supabase-js always requests `${SUPABASE_URL}/rest/v1/...`; PostgREST serves at
  # its root. This maps the one path. Internal only — never published.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [rest]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./data/minio:/data
    networks: [internal]

  web:
    container_name: demo-web
    build:
      context: ./src
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [gateway, minio]
    env_file: .env
    environment:
      SUPABASE_URL: http://gateway
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: demo
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      APP_BASE_URL: https://demo.olvyx.com
      NEXT_PUBLIC_APP_URL: https://demo.olvyx.com
      # CBG is in Nashville. The seed places meetings in local time, and a container
      # defaults to UTC — without this the 8am meeting lands at 3am.
      TZ: America/Chicago
    # `internal` for its dependencies; `reverse-proxy` so SWAG can reach it by name.
    networks: [internal, reverse-proxy]

networks:
  internal: {}
  reverse-proxy:
    external: true
